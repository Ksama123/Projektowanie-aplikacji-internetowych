<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Zadanie 5</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      // KROK 1: Definicja funkcji przeliczNaMetry
      function przeliczNaMetry(km){
        return km*1000
      }
    </script>
  </head>
  <body>
    <h1>Zadanie 5: Return</h1>
    <p>Przeliczanie kilometrów na metry.</p>
    <div id="wynik">
      <script>
        // KROK 2: Użycie funkcji i wyświetlenie wyników
        let wynik1 = przeliczNaMetry(5)
        let wynik2 = przeliczNaMetry(1.5)
        document.write("5km jest równe: " + wynik1 + "<br>1.5km jest równe: " + wynik2)
      </script>
    </div>
